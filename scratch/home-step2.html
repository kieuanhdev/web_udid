<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .iphone-screen {
    width: 393px;
    height: 440px;
    background: #F2F2F7;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 48px;
    padding: 12px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    z-index: 10;
    background: #0D1117;
  }
  .dynamic-island {
    width: 120px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    margin: 0 auto;
    position: absolute;
    left: calc(50% - 60px);
    top: 10px;
  }
  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }

.sheet-bg {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}
.share-sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: #F2F2F7;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  padding: 10px 16px 24px;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.3);
}
.sheet-handle {
  width: 36px;
  height: 5px;
  background: #C7C7CC;
  border-radius: 3px;
  margin: 0 auto 12px;
}
.sheet-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: #FFF;
  border-radius: 12px;
  margin-bottom: 14px;
}
.preview-icon {
  width: 38px; height: 38px;
  background: #EA5626;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 16px;
}
.preview-text h4 { font-size: 14px; font-weight: 600; color: #000; }
.preview-text p { font-size: 12px; color: #8E8E93; }

.sheet-actions {
  background: #FFF;
  border-radius: 12px;
  overflow: hidden;
}
.action-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px;
  border-bottom: 0.5px solid rgba(60,60,67,0.18);
  font-size: 15px;
  color: #000;
}
.action-row:last-child { border-bottom: none; }
.action-row.highlighted {
  background: rgba(0, 122, 255, 0.08);
  border: 2px solid #007AFF;
  border-radius: 12px;
  margin: -1px;
  position: relative;
}
.action-tag {
  background: #FF3B30;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 8px;
  margin-right: 8px;
}
</style>
</head>
<body>
<div class="iphone-screen">
  <div class="sheet-bg"></div>

  <div class="share-sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-preview">
      <div class="preview-icon">UDID</div>
      <div class="preview-text">
        <h4>Lấy UDID thiết bị iOS</h4>
        <p>udid.kieuanhdev.id.vn</p>
      </div>
    </div>

    <div class="sheet-actions">
      <div class="action-row">
        <span>Sao chép liên kết</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3C3C43" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>

      <!-- Dòng được highlight -->
      <div class="action-row highlighted">
        <div style="display:flex;align-items:center;gap:10px;">
          <strong style="font-size:15px;color:#000;">Thêm vào Màn hình chính</strong>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="action-tag">CHỌN DÒNG NÀY</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
      </div>

      <div class="action-row">
        <span>Thêm dấu trang</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3C3C43" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
